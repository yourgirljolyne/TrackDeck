name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: TrackDeck
        run: dotnet publish -c Release -r win-x64 -o dist -p:PublishSingleFile=true -p:SelfContained=false -p:DebugType=none

      - name: Package iCUE widget
        shell: pwsh
        run: Compress-Archive -Path icue-widget/* -DestinationPath trackdeck-widget.zip; Move-Item trackdeck-widget.zip trackdeck.icuewidget

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck
          path: |
            TrackDeck/dist/TrackDeck.exe
            trackdeck.icuewidget

      # Notes come from .github/release-notes/<tag>.md: first line "# title", then the body.
      # The shared footer (install steps, downloads) is added to every release.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $file = ".github/release-notes/$tag.md"
          $lines = if (Test-Path $file) { @(Get-Content $file -Encoding utf8) } else { @("# $tag") }
          $title = $lines[0] -replace '^#\s*', ''
          $body = @($lines | Select-Object -Skip 1) + '' + @(Get-Content .github/release-notes/_footer.md -Encoding utf8)
          $body | Set-Content release-notes.md -Encoding utf8
          "title=$title" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: |
            TrackDeck/dist/TrackDeck.exe
            trackdeck.icuewidget
