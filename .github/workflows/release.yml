name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: TrackDeck
        run: dotnet publish -c Release -r win-x64 -o dist -p:PublishSingleFile=true -p:SelfContained=false -p:DebugType=none

      - name: Package iCUE widget
        shell: pwsh
        run: Compress-Archive -Path icue-widget/* -DestinationPath trackdeck-widget.zip; Move-Item trackdeck-widget.zip trackdeck.icuewidget

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck
          path: |
            TrackDeck/dist/TrackDeck.exe
            trackdeck.icuewidget

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TrackDeck/dist/TrackDeck.exe
            trackdeck.icuewidget
